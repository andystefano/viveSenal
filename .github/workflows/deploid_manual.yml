name: 🚀 Deploy to Google Cloud Run

on:
  workflow_dispatch:  # permite ejecutar manualmente

# Configurar en GitHub → Settings → Secrets and variables → Actions:
#   secrets.GCP_SA_KEY         JSON de una service account con roles:
#                              Cloud Run Admin, Cloud Build Editor, Artifact Registry Writer,
#                              Service Account User y Storage Admin (bucket de --source).
#   vars.GCP_PROJECT_ID        ID del proyecto
#   vars.GCP_REGION            ej. southamerica-west1
#   vars.CLOUD_RUN_SERVICE     ej. vivesenal
#
# El primer deploy se hace a mano (ver README) con --env-vars-file y --add-cloudsql-instances.
# Los siguientes heredan esa configuración: este workflow solo publica código nuevo.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, fileinfo, gd
          tools: composer:v2

      - name: Lint & build assets
        run: |
          npm ci
          npm run lint
          npm run build

      - name: PHP tests
        run: |
          composer install --prefer-dist --no-interaction
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy (Cloud Build + Cloud Run)
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --source . \
            --region "${{ vars.GCP_REGION }}" \
            --quiet

      - name: Health check
        run: |
          URL=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          echo "Servicio: $URL"
          curl -fsS "$URL/up" > /dev/null && echo "✅ /up OK"
          curl -fsS "$URL/api/fechas/1" | head -c 300; echo
