# Plantilla: copiar a env.cloudrun.yaml (ese archivo NO se versiona).
# Uso: gcloud run deploy vivesenal --source . --env-vars-file env.cloudrun.yaml
# Cloud Run exige que todos los valores sean strings (van entre comillas).
# Recomendado: DB_PASSWORD, APP_KEY y ADMIN_PASSWORD en Secret Manager
# (--set-secrets) y quitarlos de este archivo.

APP_NAME: "Vive Señal"
APP_ENV: "production"
APP_KEY: "CAMBIAR (php artisan key:generate --show)"
APP_DEBUG: "false"
APP_URL: "https://www.xn--viveseal-i3a.cl"
APP_TIMEZONE: "America/Santiago"
APP_LOCALE: "es"
APP_FALLBACK_LOCALE: "es"
LOG_CHANNEL: "stderr"
LOG_LEVEL: "info"

# Cloud SQL (MySQL 8) por socket: requiere --add-cloudsql-instances
DB_CONNECTION: "mysql"
DB_SOCKET: "/cloudsql/PROYECTO:REGION:INSTANCIA"
DB_DATABASE: "web_senal"
DB_USERNAME: "vivesenal"
DB_PASSWORD: "CAMBIAR"

# Cloud Run puede levantar varias instancias: sesiones y cache van a la BD.
SESSION_DRIVER: "database"
SESSION_SECURE_COOKIE: "true"
CACHE_STORE: "database"
QUEUE_CONNECTION: "sync"
MAIL_MAILER: "log"

ADMIN_NAME: "Andy"
ADMIN_EMAIL: "andy@andy.cl"
ADMIN_PASSWORD: "CAMBIAR"

RUN_MIGRATIONS: "1"
