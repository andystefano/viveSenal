name: 🚀 Deploy Laravel (web + admin) to Plesk via SSH

on:
  workflow_dispatch:  # permite ejecutar manualmente
    inputs:
      seed:
        description: "Ejecutar db:seed (crea el usuario inicial de /admin si no existe)"
        type: boolean
        default: false

# Carpeta de la app en el servidor. En Plesk, la raíz de documentos del dominio
# debe apuntar a "<APP_DIR>/public" (Hosting Settings → Document root: app/public).
# La carpeta httpdocs anterior (build de React) queda intacta como respaldo.
env:
  APP_DIR: /var/www/vhosts/xn--viveseal-i3a.cl/app
  PHP_BIN: ${{ vars.PHP_BIN || '/opt/plesk/php/8.3/bin/php' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, fileinfo, sqlite3, pdo_sqlite
          tools: composer:v2

      - name: Install JS dependencies & build assets
        run: |
          npm ci
          npm run build

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts

      - name: Run tests
        run: |
          composer install --prefer-dist --no-interaction --no-scripts
          cp .env.example .env
          php artisan key:generate
          php artisan test
          rm .env
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts

      - name: Package release
        run: |
          tar -czf release.tar.gz \
            --exclude=.git --exclude=.github --exclude=node_modules --exclude=tests \
            --exclude=build --exclude=devtools --exclude=.env --exclude=release.tar.gz \
            .
          ls -lh release.tar.gz

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload release
        run: |
          sshpass -p "${{ secrets.SSH_PASS }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SFTP_HOST }} "mkdir -p $APP_DIR"
          sshpass -p "${{ secrets.SSH_PASS }}" scp -o StrictHostKeyChecking=no \
            release.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SFTP_HOST }}:$APP_DIR/release.tar.gz

      - name: Extract & run Laravel tasks
        run: |
          sshpass -p "${{ secrets.SSH_PASS }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SFTP_HOST }} bash -s <<EOF
          set -e
          cd "$APP_DIR"
          if [ ! -f .env ]; then
            echo "❌ Falta $APP_DIR/.env en el servidor. Créalo a partir de .env.example antes de desplegar."
            rm -f release.tar.gz
            exit 1
          fi
          "$PHP_BIN" artisan down --retry=15 || true
          trap '"$PHP_BIN" artisan up || true' EXIT
          rm -rf public/build
          tar -xzf release.tar.gz
          rm -f release.tar.gz
          mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache
          "$PHP_BIN" artisan migrate --force
          if [ "${{ inputs.seed }}" = "true" ]; then "$PHP_BIN" artisan db:seed --force; fi
          "$PHP_BIN" artisan optimize
          echo "✅ Deploy terminado"
          EOF

      - name: Post-deployment verification
        run: |
          sshpass -p "${{ secrets.SSH_PASS }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SFTP_HOST }} \
            "cd $APP_DIR && \"$PHP_BIN\" artisan about --only=environment && test -f public/build/manifest.json && echo 'manifest.json: FOUND'"
